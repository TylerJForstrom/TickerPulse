# Near-live worker: runs the full ingest → NLP → metrics pipeline on a
# schedule and writes results to Postgres. Free on public repos.
# (Editing this file also re-registers the cron with GitHub's scheduler
# and triggers an immediate run — handy after adding source secrets or
# changing worker behavior, e.g. new ingest adapters.)
#
# Required repository secrets for live mode:
#   DATABASE_URL              (Supabase/Neon Postgres connection string)
# Optional: REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET, REDDIT_USER_AGENT,
#           BLUESKY_HANDLE, BLUESKY_APP_PASSWORD, HF_TOKEN
#
# Without DATABASE_URL the job exits quietly — the deployed demo keeps
# serving the bundled sample artifacts.
name: pipeline

on:
  schedule:
    # This requests a run every 15 min, but GitHub's shared scheduler drops
    # most ticks regardless: measured 2026-08-01..03, only 10-16 scheduled
    # runs/day actually fired (start-to-start gaps up to ~3h35m), all
    # successful — the loss is upstream tick delivery, not run failures.
    # Off-mark minutes still help at the margin (:00/:15/:30/:45 are the
    # most contended slots). Ingestion is therefore gap-tolerant instead of
    # cadence-dependent: listing adapters paginate back INGEST_LOOKBACK_HOURS
    # (default 6h ≈ 1.7x the worst observed gap) and print a `[saturation]`
    # line when a listing outruns its page budget — see
    # worker/ingest/base.py drain_pages.
    - cron: "4,19,34,49 * * * *"
  push:
    # Editing this file on main re-registers the cron and triggers an
    # immediate run. main only: a push-triggered run on a feature branch
    # would hit the live DB and could commit archive files onto the branch,
    # colliding with main's own archive commits. To verify a branch, use
    # workflow_dispatch with --ref <branch> instead.
    branches: [main]
    paths: [".github/workflows/pipeline.yml"]
  workflow_dispatch:
    inputs:
      skip_topics:
        description: "Skip topic clustering (faster run)"
        type: boolean
        default: false

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write   # the archive stage commits history back to the repo

env:
  # Node 20 actions are force-migrated to Node 24 on 2026-06-16; opt in
  # early so the cutover can't silently break the cron.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check live mode
        id: live
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "No DATABASE_URL secret — demo deployment, nothing to do."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.live.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (incl. FinBERT + embeddings)
        if: steps.live.outputs.enabled == 'true'
        run: |
          pip install -r requirements.txt -r requirements-ml.txt

      - name: Cache HuggingFace models
        if: steps.live.outputs.enabled == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1

      - name: Run pipeline
        if: steps.live.outputs.enabled == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          ARGS=""
          if [ "${{ inputs.skip_topics }}" = "true" ]; then ARGS="--skip-topics"; fi
          python -m worker.pipeline $ARGS

      - name: Commit archived metrics
        # The runner disk is destroyed after this job: the archive stage's
        # output is only durable once committed. Runs even if the pipeline
        # step failed partway — whatever was archived should survive.
        if: always() && steps.live.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A archive
          if git diff --cached --quiet; then
            echo "no new archive files"
            exit 0
          fi
          git commit -m "archive: sentiment history $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main || exit 1
          done
          exit 1
